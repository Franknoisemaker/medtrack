# MedTrack — Pipeline de Producción
# Trigger: push a main únicamente.
# Secuencia: CI (lint → tsc → test → build) → Supabase (migraciones + Edge Functions) → Deploy Vercel
# El deploy NUNCA se ejecuta si algún paso del CI falla, y el frontend nunca se publica
# antes de que la base de datos y las Edge Functions de las que depende estén aplicadas.

name: Producción — CI → Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

# Nunca dos despliegues de producción (y sus migraciones) en paralelo
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Integración Continua
  # ─────────────────────────────────────────
  ci:
    name: CI — Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expediente-medico-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: expediente-medico-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Tests unitarios (Vitest)
        run: npm test
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-for-tests

      - name: Tests de Integridad de Datos y Somatometría
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-for-tests

      - name: Build de producción
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-for-tests
          NODE_ENV: production

  # ─────────────────────────────────────────
  # JOB 2: Supabase — migraciones + Edge Functions
  # Solo se ejecuta si el CI pasa. Aplica únicamente las migraciones pendientes
  # (supabase db push compara contra supabase_migrations.schema_migrations).
  # ─────────────────────────────────────────
  supabase:
    name: Supabase — Migraciones & Edge Functions
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    defaults:
      run:
        working-directory: expediente-medico-app
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link proyecto de producción
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PRODUCTION }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
        run: |
          if [ -z "${PROJECT_REF}" ] || [ -z "${DB_PASSWORD}" ] || [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Faltan secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF_PRODUCTION o SUPABASE_DB_PASSWORD_PRODUCTION"
            exit 1
          fi
          supabase link --project-ref "${PROJECT_REF}" --password "${DB_PASSWORD}"

      - name: Migraciones pendientes (dry-run, para el log)
        run: supabase db push --linked --dry-run

      - name: Aplicar migraciones
        run: supabase db push --linked

      - name: Desplegar Edge Functions
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PRODUCTION }}
        run: |
          # Todas las funciones del repo (excepto _shared); verify_jwt=false como en config.toml,
          # cada función valida el JWT del doctor por sí misma.
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ "$fn" = "_shared" ] && continue
            echo "▶ Desplegando $fn"
            supabase functions deploy "$fn" --project-ref "${PROJECT_REF}" --no-verify-jwt
          done

  # ─────────────────────────────────────────
  # JOB 3: Deploy a Producción
  # Solo se ejecuta si el CI pasa y la base de datos / Edge Functions ya están desplegadas.
  # ─────────────────────────────────────────
  deploy:
    name: Deploy → medtrack.mx
    runs-on: ubuntu-latest
    needs: [ci, supabase]      # ← bloqueado hasta CI verde y Supabase desplegado
    environment: production    # ← requiere aprobación manual en GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: expediente-medico-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: expediente-medico-app

      - name: Build con variables de producción reales
        run: npm run build
        working-directory: expediente-medico-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_PROD }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_PROD }}
          NODE_ENV: production

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy a Vercel (producción)
        working-directory: expediente-medico-app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --prod \
            --token="${VERCEL_TOKEN}" \
            --yes

      - name: Marcar commit como desplegado
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              description: 'Desplegado a medtrack.mx',
              context: 'deploy/production'
            });

      - name: Notificar fallo de deploy
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              description: 'Deploy falló — CI pasó pero el deploy no',
              context: 'deploy/production'
            });
